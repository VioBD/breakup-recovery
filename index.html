<!-- ... (păstrăm tot începutul până la secțiunea Demo) ... -->

    <!-- DEMO SECTION -->
    <section id="demo" class="max-w-5xl mx-auto px-6 py-24">
        <div class="bg-white p-10 md:p-16 rounded-[3rem] shadow-2xl border border-brand-dark/5 space-y-12">
            
            <h2 class="lang-ro text-4xl font-serif italic text-center">Spațiul tău de dialog</h2>

            <!-- INPUT AREA -->
            <div id="inputArea" class="space-y-12 transition-all duration-500">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-4 opacity-50 tracking-widest text-center">0. Despre cine este vorba?</label>
                    <div class="flex justify-center gap-4">
                        <button onclick="setGender('el')" id="gen-el" class="gen-btn px-10 py-3 border border-brand-dark/10 rounded-full bg-white text-sm italic font-serif transition-all hover:border-brand-dark">El / Him</button>
                        <button onclick="setGender('ea')" id="gen-ea" class="gen-btn px-10 py-3 border border-brand-dark/10 rounded-full bg-white text-sm italic font-serif transition-all hover:border-brand-dark">Ea / Her</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-4 opacity-50 tracking-widest text-center">1. Ce speri să obții?</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <button onclick="selectObj(this, 'Claritate')" class="opt-btn p-6 border border-brand-dark/10 rounded-2xl text-left bg-white transition hover:border-brand-dark">
                            <span class="block font-serif italic text-xl underline">Un răspuns clar</span>
                            <span class="text-[10px] opacity-60">Unde ne aflăm?</span>
                        </button>
                        <button onclick="selectObj(this, 'Apropiere')" class="opt-btn p-6 border border-brand-dark/10 rounded-2xl text-left bg-white transition hover:border-brand-dark">
                            <span class="block font-serif italic text-xl underline">Apropiere</span>
                            <span class="text-[10px] opacity-60">Vreau reluarea legăturii.</span>
                        </button>
                        <button onclick="selectObj(this, 'Descărcare')" class="opt-btn p-6 border border-brand-dark/10 rounded-2xl text-left bg-white transition hover:border-brand-dark">
                            <span class="block font-serif italic text-xl underline">Descărcare</span>
                            <span class="text-[10px] opacity-60">Să spun ce am pe suflet.</span>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-4 opacity-50 tracking-widest text-center">2. Draftul mesajului către fostul</label>
                    <textarea id="userMessage" class="w-full h-40 bg-brand-beige/30 border border-brand-dark/10 rounded-[2rem] p-8 text-lg outline-none focus:ring-1 focus:ring-brand-dark shadow-inner" placeholder="Scrie aici ce ai vrea să-i trimiți..."></textarea>
                </div>

                <button onclick="runInitialAnalysis()" id="btnRun" class="w-full bg-brand-dark text-white py-6 rounded-full font-bold text-xl shadow-xl transition-all active:scale-95">
                    Analizează draftul →
                </button>
            </div>

            <!-- RESULT & CHAT AREA -->
            <div id="resultArea" class="hidden space-y-8">
                <!-- Analiza inițială stilizată ca "Reflection Card" -->
                <div class="bg-brand-dark text-brand-beige p-10 rounded-[3rem] shadow-2xl border-l-8 border-brand-accent">
                    <span class="text-[10px] font-bold uppercase tracking-[0.3em] opacity-40 mb-6 block">Perspectiva Psihoterapeutului</span>
                    <div id="initialAnalysisText" class="text-xl italic leading-relaxed whitespace-pre-wrap opacity-95 font-serif"></div>
                </div>

                <!-- Chat Window -->
                <div id="chatWindow" class="h-[500px] overflow-y-auto p-8 bg-brand-beige/20 rounded-[3rem] space-y-6 border border-brand-dark/5 shadow-inner">
                    <!-- Mesajele apar aici -->
                </div>

                <!-- Input Chat cu Loading State -->
                <div class="flex gap-4 items-end">
                    <textarea id="chatInput" class="flex-1 bg-white border border-brand-dark/10 rounded-[2rem] px-8 py-5 outline-none focus:ring-1 focus:ring-brand-dark shadow-sm resize-none" placeholder="Răspunde sau pune o întrebare..." rows="1"></textarea>
                    <button onclick="sendChatMessage()" id="btnChat" class="bg-brand-dark text-white px-10 py-5 rounded-full font-bold hover:bg-black transition-all shadow-lg active:scale-95">
                        Trimite
                    </button>
                </div>

                <!-- BUTOANE DE DECIZIE (Apar după câteva mesaje) -->
                <div id="decisionButtons" class="hidden pt-8 border-t border-brand-dark/10 flex flex-wrap justify-center gap-4">
                    <button onclick="finalDecision('no-send')" class="bg-green-800 text-white px-8 py-4 rounded-full font-bold text-sm uppercase tracking-widest shadow-lg">Am decis să NU trimit</button>
                    <button onclick="finalDecision('send-anyway')" class="bg-white text-brand-dark border border-brand-dark px-8 py-4 rounded-full font-bold text-sm uppercase tracking-widest shadow-lg">Vreau să trimit oricum</button>
                    <button onclick="location.reload()" class="opacity-40 text-[10px] uppercase font-bold tracking-widest w-full mt-4">O iau de la capăt cu alt gând</button>
                </div>
            </div>
        </div>
    </section>

<!-- ... (păstrăm restul secțiunilor) ... -->

<script>
    let selectedGender = "";
    let selectedObjective = "";
    let chatHistory = [];
    let messageCount = 0;

    function setGender(gen) {
        selectedGender = gen;
        document.querySelectorAll('.gen-btn').forEach(b => b.classList.remove('selected-option'));
        document.getElementById('gen-' + gen).classList.add('selected-option');
    }

    function selectObj(btn, obj) {
        selectedObjective = obj;
        document.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('selected-option'));
        btn.classList.add('selected-option');
    }

    async function runInitialAnalysis() {
        const m = document.getElementById('userMessage').value;
        if(!m || !selectedGender || !selectedObjective) {
            alert("Te rugăm să completezi toți pașii."); return;
        }

        const btn = document.getElementById('btnRun');
        btn.innerText = "Analizăm situația...";
        btn.classList.add('loading-pulse');
        btn.disabled = true;

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: m, objective: selectedObjective, gender: selectedGender, 
                    type: 'initial', lang: 'ro' 
                })
            });
            const data = await response.json();
            
            document.getElementById('inputArea').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('initialAnalysisText').innerText = data.text;
            
            chatHistory.push({ role: 'assistant', content: data.text });
            document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
        } catch (e) {
            alert("Eroare de conexiune.");
        }
    }

    async function sendChatMessage() {
        const input = document.getElementById('chatInput');
        const btn = document.getElementById('btnChat');
        const msg = input.value;
        if(!msg) return;

        appendMessage(msg, 'user');
        input.value = "";
        
        // Feedback vizual pe butonul de chat
        btn.innerText = "...";
        btn.disabled = true;
        btn.classList.add('loading-pulse');

        try {
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: msg, gender: selectedGender, 
                    type: 'chat', history: chatHistory, lang: 'ro' 
                })
            });
            const data = await response.json();
            appendMessage(data.text, 'ai');
            chatHistory.push({ role: 'user', content: msg }, { role: 'assistant', content: data.text });
            
            messageCount++;
            // Arătăm butoanele de decizie după 1-2 schimburi de mesaje
            if(messageCount >= 1) {
                document.getElementById('decisionButtons').classList.remove('hidden');
            }
        } catch (e) {
            appendMessage("Eroare de conexiune.", 'ai');
        } finally {
            btn.innerText = "Trimite";
            btn.disabled = false;
            btn.classList.remove('loading-pulse');
        }
    }

    function appendMessage(text, side) {
        const win = document.getElementById('chatWindow');
        const div = document.createElement('div');
        div.className = side === 'user' 
            ? "bg-brand-accent/30 p-6 rounded-[2rem] rounded-tr-none ml-auto max-w-[85%] text-base shadow-sm"
            : "bg-brand-dark text-brand-beige p-8 rounded-[2rem] rounded-tl-none mr-auto max-w-[95%] text-base italic whitespace-pre-wrap shadow-md leading-relaxed";
        div.innerText = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }

    function finalDecision(type) {
        const win = document.getElementById('chatWindow');
        if(type === 'no-send') {
            appendMessage("Am decis să NU trimit mesajul. Simt că e mai bine pentru liniștea mea.", 'user');
            setTimeout(() => {
                appendMessage("Aceasta este o victorie uriașă pentru tine. Ai ales să îți protejezi energia și demnitatea. Sunt mândru de tine. Cum te simți acum că ai luat această decizie?", 'ai');
            }, 1000);
        } else {
            appendMessage("Vreau să-l trimit oricum. Simt că am nevoie de acest ultim contact.", 'user');
            setTimeout(() => {
                appendMessage("Înțeleg. Dacă simți că este necesar pentru încheierea ta, fă-o cu blândețe față de tine. Asigură-te că nu aștepți un anumit răspuns, ci o faci doar pentru a pune punct. Vrei să te ajut să reformulezi mesajul ca să sune cât mai matur și demn?", 'ai');
            }, 1000);
        }
        document.getElementById('decisionButtons').classList.add('hidden');
    }
</script>
